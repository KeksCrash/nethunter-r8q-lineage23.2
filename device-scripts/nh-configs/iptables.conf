#!/system/bin/sh
# NetHunter Evil Twin iptables config
# Fixed for SM-G781B / Android 16 / LineageOS 23.2

# Enable IP forwarding
echo 1 > /proc/sys/net/ipv4/ip_forward

# Fix Android policy routing (rule 32000 = unreachable blocks forwarded traffic)
ip rule del from 10.0.0.0/24 lookup main 2>/dev/null
ip rule del iif wlan1 lookup main 2>/dev/null
ip rule add from 10.0.0.0/24 lookup main prio 9000
ip rule add iif wlan1 lookup main prio 9001

# Flush Android tetherctrl DROP-all rule that blocks forwarding
iptables -F tetherctrl_FORWARD 2>/dev/null

# FORWARD rules: AP clients (wlan1) -> Internet (wlan0)
iptables -I FORWARD 1 -i wlan1 -o wlan0 -j ACCEPT
iptables -I FORWARD 2 -i wlan0 -o wlan1 -m state --state RELATED,ESTABLISHED -j ACCEPT

# NAT: MASQUERADE on the internet-facing interface (wlan0)
iptables -t nat -A POSTROUTING -o wlan0 -j MASQUERADE
